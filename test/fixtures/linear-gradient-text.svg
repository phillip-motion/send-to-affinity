<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="linear" x1="80" y1="80" x2="620" y2="180" gradientUnits="userSpaceOnUse">
<stop stop-color="#0EE0DC"/><stop offset="0.57327" stop-color="#4778FF"/><stop offset="0.878934" stop-color="#701CEE" stop-opacity="0.6"/>
</linearGradient>
<linearGradient id="inherited" href="#linear"/>
<linearGradient id="box"><stop stop-color="#0EE0DC"/><stop offset="1" stop-color="#701CEE"/></linearGradient>
<clipPath id="clip"><rect x="60" y="60" width="600" height="120"/></clipPath>
</defs>
<rect width="900" height="650" fill="white"/>
<rect id="Shape gradient" x="80" y="20" width="600" height="30" fill="url(#linear)"/>
<text id="Plain" font-family="Arial" font-size="72" x="80" y="150" fill="url(#linear)">Linear gradient</text>
<g transform="translate(70 180) rotate(-8)">
<text id="Rotated" font-family="Arial" font-size="72" x="80" y="150" fill="url(#inherited)">Linear gradient</text>
</g>
<g transform="translate(0 300)" fill="url(#linear)">
<text id="Mixed styles" font-family="Arial" font-size="72" x="80" y="150" clip-path="url(#clip)"><tspan font-weight="bold">Linear </tspan><tspan font-style="italic">gradient</tspan></text>
</g>
<text id="Bounding box" font-family="Arial" font-size="72" x="80" y="570" fill="url(#box)">Linear gradient</text>
</svg>
