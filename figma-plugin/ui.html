const NATIVE_IMPORTER="/* Send to Affinity importer. The Figma plugin embeds everything above the\n * export marker at the bottom and runs it through Affinity's MCP execute_script.\n * SVG geometry is handled by Affinity's native SVG importer.\n * compile() also runs in Node for testing.\n */\n'use strict';\n\nconst esc = s => String(s).replace(/&/g, '&amp;').replace(/\u003c/g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\nfunction fail(message) { throw new Error(message); }\nfunction layerName(packet, id) { return packet?.layers?.find(l=>l.marker===id)?.name || 'A layer'; }\n// Figma renders only the first of GLASS/BACKGROUND_BLUR found on a layer; mirrors\n// the same scan the Figma plugin already applied (defense in depth, since this\n// runs in a different process from that decision).\nfunction visibleGlassEffect(effects) {\n    for (const e of effects || []) {\n        if (!e || e.visible === false) continue;\n        if (e.type === 'GLASS') return e;\n        if (e.type === 'BACKGROUND_BLUR') return null;\n    }\n    return null;\n}\nfunction warn(list, message) { if (!list.includes(message)) list.push(message); }\nfunction finite(n, label) { if (!Number.isFinite(n)) fail('Invalid ' + label); return n; }\nfunction number(s, label) {\n    if (!/^[+-]?(?:\\d+\\.?\\d*|\\.\\d+)(?:e[+-]?\\d+)?$/i.test(String(s).trim())) fail('Invalid ' + label + ': ' + s);\n    return finite(Number(s), label);\n}\nfunction splitTop(s, delimiter) {\n    let level = 0, quote = '', start = 0, result = [];\n    for (let i = 0; i \u003c s.length; i++) {\n        const c = s[i];\n        if (quote) { if (c === quote && s[i - 1] !== '\\\\') quote = ''; continue; }\n        if (c === '\"' || c === \"'\") quote = c;\n        else if (c === '(') level++;\n        else if (c === ')') { if (--level \u003c 0) fail('Unbalanced parentheses.'); }\n        else if (c === delimiter && !level) { result.push(s.slice(start, i).trim()); start = i + 1; }\n    }\n    if (level || quote) fail('Unclosed value.');\n    result.push(s.slice(start).trim());\n    return result;\n}\n\nfunction colour(s) {\n    s = s.trim();\n    if (/^#[\\da-f]{3,4}$|^#[\\da-f]{6}$|^#[\\da-f]{8}$/i.test(s)) {\n        let h = s.slice(1); if (h.length \u003c= 4) h = h.split('').map(c => c + c).join('');\n        return {colour: '#' + h.slice(0, 6), opacity: h.length === 8 ? parseInt(h.slice(6), 16) / 255 : 1};\n    }\n    if (/^(white|black|red|green|blue|yellow|gray|grey|purple|orange|pink)$/i.test(s)) return {colour: s, opacity: 1};\n    if (s === 'transparent') return {colour: '#000000', opacity: 0};\n    const m = /^rgba?\\(([^)]+)\\)$/i.exec(s);\n    if (m) {\n        const values = m[1].split(',').map(x => x.trim());\n        if (values.length !== 3 && values.length !== 4) fail('Use comma-separated rgb()/rgba() colours.');\n        const rgb = values.slice(0, 3).map(v => {\n            const n = number(v.replace(/%$/, ''), 'colour') * (v.endsWith('%') ? 255 / 100 : 1);\n            if (n \u003c 0 || n > 255) fail('Colour channel outside 0–255.');\n            return Math.round(n);\n        });\n        const a = values.length === 4 ? number(values[3], 'alpha') : 1;\n        if (a \u003c 0 || a > 1) fail('Colour alpha outside 0–1.');\n        return {colour: 'rgb(' + rgb.join(',') + ')', opacity: a};\n    }\n    fail('Unsupported colour: ' + s);\n}\n\n// A small XML reader for inspection and targeted filter repair. SVG geometry stays native.\nfunction decode(s) {\n    return s.replace(/&([^;]+);/g, (_, name) => {\n        const entities = {amp: '&', lt: '\u003c', gt: '>', quot: '\"', apos: \"'\"};\n        if (Object.hasOwnProperty.call(entities, name)) return entities[name];\n        if (/^#x[\\da-f]+$/i.test(name)) return String.fromCodePoint(parseInt(name.slice(2), 16));\n        if (/^#\\d+$/.test(name)) return String.fromCodePoint(parseInt(name.slice(1), 10));\n        fail('Unsupported XML entity: &' + name + ';');\n    });\n}\nfunction parseXml(source) {\n    if (/\u00 /* Local transport only. Import logic executes inside Affinity, never in a helper. */
'use strict';
const SETUP_MESSAGE='Can’t reach Affinity. Open Affinity, then go to **Settings** → **Model Context Protocol** and turn on both *Enable Affinity MCP* and *Access Files on your Desktop*.';
class AffinityConnection {
    constructor({EventSourceClass=globalThis.EventSource,fetchFn=globalThis.fetch,timeoutMs=120000}={}) {
        this.EventSourceClass=EventSourceClass;this.fetchFn=fetchFn.bind(globalThis);this.timeoutMs=timeoutMs;
        this.base='http://localhost:6767';this.pending=new Map();this.serial=0;
    }
    async connect() {
        this.close();
        try {
            this.endpoint=await new Promise((resolve,reject)=>{
                const stream=this.stream=new this.EventSourceClass(this.base+'/sse');
                let opened=false;
                const timeout=setTimeout(()=>reject(new Error(SETUP_MESSAGE)),4000);
                stream.addEventListener('endpoint',event=>{
                    clearTimeout(timeout);opened=true;
                    try{
                        const url=new URL(event.data,this.base);
                        if(url.origin!==this.base || url.pathname!=='/message')throw new Error('Unexpected Affinity connection address.');
                        resolve(url.href);
                    }catch(e){reject(e);}
                });
                stream.onmessage=event=>{
                    let message;try{message=JSON.parse(event.data);}catch(e){return;}
                    const p=this.pending.get(message.id);if(!p)return;
                    this.pending.delete(message.id);clearTimeout(p.timer);
                    if(message.error)p.reject(new Error(message.error.message || 'Affinity rejected the request.'));
                    else p.resolve(message.result);
                };
                stream.onerror=()=>{
                    clearTimeout(timeout);
                    const error=new Error(opened ? 'The connection to Affinity closed. If import had started, check Affinity before sending again.' : SETUP_MESSAGE);
                    reject(error);this.close(error);
                };
            });
            await this.rpc('initialize',{protocolVersion:'2025-11-25',capabilities:{},clientInfo:{name:'Send to Affinity',version:'0.6.2'}});
            await this.rpc('notifications/initialized',{},true);
            await this.tool('read_sdk_documentation_topic',{filename:'preamble'});
        } catch(e){this.close(e);throw e;}
    }
    rpc(method,params,notification=false) {
        if(!this.stream || !this.endpoint)return Promise.reject(new Error('Connect to Affinity first.'));
        const id=++this.serial,body={jsonrpc:'2.0',method,params};if(!notification)body.id=id;
        return new Promise((resolve,reject)=>{
            const timer=setTimeout(()=>{
                this.pending.delete(id);
                reject(new Error('Affinity has not replied yet. Check Affinity before sending again; it may still be importing.'));
            },this.timeoutMs);
            if(!notification)this.pending.set(id,{resolve,reject,timer});
            this.fetchFn(this.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
                .then(response=>{
                    if(!response.ok)throw new Error('Affinity returned HTTP '+response.status+'.');
                    if(notification){clearTimeout(timer);resolve();}
                }).catch(error=>{clearTimeout(timer);this.pending.delete(id);reject(error);});
        });
    }
    async tool(name,args) {
        const result=await this.rpc('tools/call',{name,arguments:args});
        const output=(result?.content || []).filter(c=>c.type==='text').map(c=>c.text).join('\n');
        if(result?.isError)throw new Error(output || 'Affinity could not complete the import.');
        return output;
    }
    close(error=new Error('Connection closed.')) {
        if(this.stream)this.stream.close();this.stream=null;this.endpoint=null;
        for(const p of this.pending.values()){clearTimeout(p.timer);p.reject(error);}this.pending.clear();
    }

function nativeImportScript(source,transfer) {
    // Both layers of serialization are intentional: design data is a string
    // literal passed to the parser, never executable JavaScript.
    return source+'\nconst __transfer='+JSON.stringify(transfer)+';\n'+
        "let __stage='preflight';try {\n"+
        "const {Environment,EnvironmentPermission}=require('/environment.js');\n"+
        'const __start=Date.now();const __compiled=compile(__transfer);const __compileMs=Date.now()-__start;\n'+
        'const __folder=workingFolder(Environment.fileSystemRoots,Environment.hasPermission(EnvironmentPermission.FileSystem));\n'+
        "__stage='import';const __imported=importPrepared(__compiled,__folder);\n"+
        "console.log('FIGMA_PASTE_RESULT:'+JSON.stringify({documentId:__imported.document.sessionUuid,name:__compiled.packet?.name || 'Figma design',artboards:__imported.artboards,counts:__imported.counts,imageLayers:__imported.imageLayers,linearGradientTextLayers:__imported.linearGradientTextLayers,textLayers:__imported.textLayers,warnings:__imported.warnings,stages:__imported.timings,timings:{compileMs:__compileMs,importMs:Date.now()-__start-__compileMs,totalMs:Date.now()-__start}}));\n"+
        "} catch(__error) { console.log('FIGMA_PASTE_ERROR:'+JSON.stringify({stage:__stage,message:__error.message || String(__error)})); }";
}
function readImportResult(output) {
    const errorPrefix='FIGMA_PASTE_ERROR:',errorAt=output.lastIndexOf(errorPrefix);
    if(errorAt>=0) {
        const error=JSON.parse(output.slice(errorAt+errorPrefix.length).trim());
        throw new Error((error.stage==='preflight' ? 'Import did not start. ' : 'Import stopped. Check Affinity’s document tabs before sending again. ')+(error.message || 'Affinity could not import this design.'));
    }
    const prefix='FIGMA_PASTE_RESULT:',at=output.lastIndexOf(prefix);
    if(at<0)throw new Error('Affinity did not confirm completion. Check its document tabs before sending again. '+output.slice(0,1200));
    const result=JSON.parse(output.slice(at+prefix.length).trim());
    if(!result.documentId)throw new Error('Affinity returned an incomplete import report.');
    return result;
}
// "Layer: message" warnings sharing a message become one entry naming the first
// two layers. Split at the last ": " since layer names may contain one.
const sentence=text=>text.charAt(0).toUpperCase()+text.slice(1);
function groupWarnings(warnings) {
    const groups=new Map();
    for(const warning of warnings) {
        const at=warning.lastIndexOf(': '),name=at>0 ? warning.slice(0,at) : '',message=at>0 ? warning.slice(at+2) : warning;
        if(!groups.has(message))groups.set(message,[]);
        if(name && !groups.get(message).includes(name))groups.get(message).push(name);
    }
    return [...groups].map(([message,names])=>({layers:names.slice(0,2).join(', ')+(names.length>2 ? ' + '+(names.length-2)+' more' : ''),message:sentence(message)}));
}
if(typeof module==='object')module.exports={AffinityConnection,nativeImportScript,readImportResult,groupWarnings};

const $=id=>document.getElementById(id);
let busy=false,valid=false,selectionId=null,connection=null,selection={label:'Nothing selected',empty:true},doneTimer;
function send(type,options={}){parent.postMessage({pluginMessage:{type,...options}},'*');}
// **bold** and *italic* markup; everything is set as text, never HTML.
function rich(element,text){
  element.replaceChildren(...text.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/).filter(Boolean).map(part=>{
    const tag=part.startsWith('**') ? 'strong' : part.startsWith('*') ? 'em' : null;
    return tag ? Object.assign(document.createElement(tag),{textContent:part.replace(/^\*+|\*+$/g,'')}) : document.createTextNode(part);
  }));
}
// Errors show their first sentence as the title and the rest as instructions below.
function status(message,tone=''){
  clearTimeout(doneTimer);$('row').classList.remove('empty');
  const [,title,detail]=tone==='error' && /^(.+?[.!?])\s+(.+)$/s.exec(message) || [,String(message),''];
  rich($('status'),title);$('status').title=title.replace(/\*/g,'');$('status').className=tone;
  rich($('detail'),detail);$('detail').hidden=!detail;
}
function showSelection(){status(selection.label);$('row').classList.toggle('empty',selection.empty);}
function update(){$('send').disabled=busy||!valid;}
function done(){connection?.close();connection=null;busy=false;update();}
function report(warnings){
  const groups=groupWarnings(warnings);$('review').open=false;
  $('warnings').replaceChildren(...groups.map(({layers,message})=>{
    const item=document.createElement('li');
    if(layers)item.append(Object.assign(document.createElement('strong'),{textContent:layers}));
    item.append(Object.assign(document.createElement('span'),{textContent:message}));return item;
  }));
  $('review').hidden=!groups.length;$('review-title').textContent=groups.length+(groups.length===1?' thing':' things')+' to review';
  return groups.length;
}
$('send').onclick=async()=>{
  if(busy||!valid)return;busy=true;update();report([]);
  try{
    status('Connecting to Affinity…');connection=new AffinityConnection();await connection.connect();
    status('Reading the design…');send('prepare',{selectionId});
  }catch(e){done();status(e.message,'error');}
};
window.onmessage=async event=>{
  // Messages are relayed by Figma's nested sandbox, not necessarily parent.
  // Only the pluginMessage envelope and known message types are consumed.
  const m=event.data?.pluginMessage;if(!m)return;
  // A different selection makes the last send's review stale; mid-send it's kept for that send.
  if(m.type==='selection'){if(!busy && m.selectionId!==selectionId)report([]);selectionId=m.selectionId;valid=m.valid;selection={label:m.label,empty:!!m.empty};if(!busy)showSelection();update();}
  if(m.type==='progress')status(m.message);
  if(m.type==='error'){done();status(m.message,'error');}
  if(m.type==='prepared'){
    status('Building in Affinity…');
    try{
      const output=await connection.tool('execute_script',{script:nativeImportScript(NATIVE_IMPORTER,JSON.stringify(m.packet))});
      const result=readImportResult(output);
      const reviews=report([...new Set([...m.packet.warnings,...result.warnings])]);
      status('Done!',reviews ? 'reviewed' : 'success');doneTimer=setTimeout(showSelection,1200);
    }catch(e){report(m.packet.warnings);status(e.message,'error');}
    finally{done();}
  }
};
// Measure the visible view, not the body: Figma keeps the body at least as tall as the window.
const fit=new ResizeObserver(()=>{
  send('resize',{height:Math.ceil($('main').getBoundingClientRect().bottom+scrollY+parseFloat(getComputedStyle(document.body).paddingBottom))});
});
fit.observe($('main'));
window.addEventListener('pagehide',()=>connection?.close());
send('ready');
