name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      # The built plugin (manifest.json, code.js, ui.html) is committed at the repo root so people can import it straight from a download.
      - name: Check the committed plugin matches the source
        run: |
          if [ -n "$(git status --porcelain -- ../manifest.json ../code.js ../ui.html)" ]; then
            echo "The built plugin is out of date. Run 'npm run build' in src/ and commit it."; git status --short -- ../manifest.json ../code.js ../ui.html; exit 1
          fi
      # Tagged builds become a release with the plugin attached.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd .. && zip "send-to-affinity-${GITHUB_REF_NAME}.zip" manifest.json code.js ui.html
          gh release create "$GITHUB_REF_NAME" "send-to-affinity-${GITHUB_REF_NAME}.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
